name: Feature request
description: Suggest something the package should be able to do
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem before the solution — the feature you need often
        already exists under a different name, and knowing the underlying
        problem usually produces a better answer than the one either of us
        started with.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      placeholder: >
        I need avatars stored as square WebP under 100KB, and right now I am
        resizing them again in a queued job after upload.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you had in mind
      description: A prop, a config key, a method — whatever shape you imagined.
      placeholder: |
        <x-af-uploader wire:model="avatar" editor is-circle target-size="100KB" />

  - type: textarea
    id: workaround
    attributes:
      label: What you are doing instead today
      description: Helps judge how much the gap actually costs.

  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: >
            I have checked the README and config/uploader.php and this is not
            already possible.
        - label: >
            This belongs in the uploader rather than in the application built on
            top of it.
        - label: I would be willing to open a pull request for this.
