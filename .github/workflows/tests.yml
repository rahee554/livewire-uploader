name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
        laravel: [11, 12]
        livewire: [3, 4]
        exclude:
          # Livewire 4 requires Laravel 12.
          - laravel: 11
            livewire: 4

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · Livewire ${{ matrix.livewire }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: fileinfo, gd, mbstring
          coverage: none

      - name: Pin dependency versions
        run: >
          composer require
          "illuminate/support:^${{ matrix.laravel }}.0"
          "livewire/livewire:^${{ matrix.livewire }}.0"
          --no-interaction --no-update

      - name: Install
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Test
        run: composer test

  lint:
    runs-on: ubuntu-latest
    name: Pint

    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none

      - run: composer install --prefer-dist --no-interaction --no-progress

      # Reports style problems without rewriting anything, so the failure
      # points at the file rather than producing a surprise diff.
      - run: composer lint:check
